[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedxray"
version = "0.1.0"
description = "Read-only diagnostic and evaluation library for sentence-transformers embeddings."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "filelock>=3.10.0",
    "torch>=2.0.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Repository = "https://github.com/asysdev/embedxray"
Issues = "https://github.com/asysdev/embedxray/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v"
